<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Reminders</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Payroll Reminders</h1>
        <form id="payrollForm">
            <div class="form-group" id="sharedFields">
                <label for="hrManagerEmail">HR Manager Email:</label>
                <input type="email" id="hrManagerEmail" required>
                <div style="margin-top: 15px;">
                    <button type="button" onclick="loadPaySchedule()" class="action-btn" style="background: #17a2b8; color: white; padding: 10px 20px;">
                        📅 Load from Schedule
                    </button>
                    <p style="font-size: 12px; color: #666; margin-top: 5px;">Auto-populate fields based on current pay period</p>
                </div>
            </div>
            <!-- Other fields and functionality here -->
        </form>
    </div>
    <script src="script.js"></script>
    <script>
        // Load Pay Schedule from JSON
        let payScheduleData = null;

        async function loadPaySchedule() {
            try {
                showStatus('Loading pay schedule...', 'info');
                
                const response = await fetch('./Pay_Schedule_FY2026.json');
                if (!response.ok) throw new Error('Failed to load pay schedule');
                
                payScheduleData = await response.json();
                const today = new Date();
                const currentPeriod = findCurrentPayPeriod(today, payScheduleData);
                
                if (!currentPeriod) {
                    showStatus('Could not determine current pay period', 'error');
                    return;
                }
                
                const retroPeriod = findRetroPeriod(currentPeriod.payPeriod, payScheduleData);
                populateFormFields(currentPeriod, retroPeriod);
                showStatus('Pay schedule loaded successfully!', 'success');
                
            } catch (error) {
                console.error('Error loading pay schedule:', error);
                showStatus('Error loading pay schedule: ' + error.message, 'error');
            }
        }

        function findCurrentPayPeriod(date, scheduleData) {
            for (let i = 0; i < scheduleData.payPeriods.length; i++) {
                const period = scheduleData.payPeriods[i];
                const payDate = new Date(period.payDate);
                const periodFrom = new Date(period.periodFrom);
                const periodThru = new Date(period.periodThru);
                
                if (date >= periodFrom && date <= payDate) {
                    return period;
                }
                
                if (i < scheduleData.payPeriods.length - 1) {
                    const nextPeriod = scheduleData.payPeriods[i + 1];
                    const nextPeriodFrom = new Date(nextPeriod.periodFrom);
                    
                    if (date > payDate && date < nextPeriodFrom) {
                        return nextPeriod;
                    }
                }
            }
            
            return scheduleData.payPeriods[scheduleData.payPeriods.length - 1];
        }

        function findRetroPeriod(currentPayPeriodNumber, scheduleData) {
            const retroPayPeriodNumber = Math.max(1, currentPayPeriodNumber - 6);
            const currentIndex = scheduleData.payPeriods.findIndex(p => p.payPeriod === currentPayPeriodNumber);
            const retroIndex = scheduleData.payPeriods.findIndex(p => p.payPeriod === retroPayPeriodNumber);
            
            if (retroIndex === -1 || currentIndex === -1) return null;
            
            return {
                start: scheduleData.payPeriods[retroIndex].periodFrom,
                end: scheduleData.payPeriods[currentIndex - 1]?.periodThru || scheduleData.payPeriods[currentIndex].periodFrom
            };
        }

        function populateFormFields(currentPeriod, retroPeriod) {
            document.getElementById('payDateInput').value = currentPeriod.payDate;
            
            const periodFromDate = new Date(currentPeriod.periodFrom);
            const periodThruDate = new Date(currentPeriod.periodThru);
            const currentPeriodText = `${periodFromDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })} - ${periodThruDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
            document.getElementById('currentPeriod').value = currentPeriodText;
            
            const employeeDueDate = new Date(currentPeriod.currentDue.employee);
            const supervisorDueDate = new Date(currentPeriod.currentDue.supervisor);
            
            document.getElementById('currentDueWorkerDateTime').value = formatDateTimeLocal(employeeDueDate);
            document.getElementById('currentDueManagerDateTime').value = formatDateTimeLocal(supervisorDueDate);
            
            if (retroPeriod) {
                const retroStartDate = new Date(retroPeriod.start);
                const retroEndDate = new Date(retroPeriod.end);
                const retroPeriodText = `${retroStartDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })} - ${retroEndDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
                document.getElementById('retroPeriod').value = retroPeriodText;
            }
            
            const retroEmployeeDueDate = new Date(currentPeriod.retroDue.employee);
            const retroSupervisorDueDate = new Date(currentPeriod.retroDue.supervisor);
            
            document.getElementById('retroDueWorkerDateTime').value = formatDateTimeLocal(retroEmployeeDueDate);
            document.getElementById('retroDueManagerDateTime').value = formatDateTimeLocal(retroSupervisorDueDate);
        }

        function formatDateTimeLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }
    </script>
</body>
</html>
