<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#500000" rx="8"/>
  
  <!-- Document/Paper shape -->
  <rect x="25" y="15" width="50" height="65" fill="white" rx="3" opacity="0.95"/>
  
  <!-- Lines on document -->
  <line x1="30" y1="25" x2="70" y2="25" stroke="#500000" stroke-width="2" opacity="0.3"/>
  <line x1="30" y1="32" x2="70" y2="32" stroke="#500000" stroke-width="2" opacity="0.3"/>
  <line x1="30" y1="39" x2="55" y2="39" stroke="#500000" stroke-width="2" opacity="0.3"/>
  
  <!-- Dollar sign circle -->
  <circle cx="50" cy="60" r="18" fill="#28a745" opacity="0.95"/>
  
  <!-- Dollar sign -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">$</text>
</svg>